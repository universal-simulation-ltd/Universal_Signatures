<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Dark mode before the first paint. The theme store (src/stores/themeStore.ts)
         applies the same class, but only once the module bundle has parsed — a
         dark-mode user would see one light frame first. This only ever ADDS
         `dark`: light is the default, so there is nothing to take away.
         The app's key is its OVERRIDE (Tune this app); absent, it follows
         Global preferences' `universal:color-scheme` — read here too, or
         someone whose only choice is the global one gets a light frame and
         then a flip.
         ⚠️ The key must match the store's; `npm run test:theme` checks it. -->
    <script>
      try {
        var pref = localStorage.getItem('unisim-signatures-theme')
          || localStorage.getItem('universal:color-scheme') || 'light'
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {
        /* private mode, storage disabled: light, exactly as the store falls back. */
      }
    </script>

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Signatures",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",

      "description": "Universal Signatures — draw or type your signature and sign PDFs entirely in your browser. 100% free and open source; documents never leave your device. Save a verified signature to the cloud with a Universal ID, or self-host for free.",

      "provider": {

        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
