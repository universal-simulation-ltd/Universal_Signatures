<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/unisim-icon.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <title>Universal Signatures — sign PDFs in your browser, free</title>
    <meta name="description" content="Universal Signatures — draw or type your signature and sign PDFs entirely in your browser. 100% free and open source; documents never leave your device. Save a verified signature to the cloud with a Universal ID, or self-host for free." />
    <meta name="keywords" content="electronic signature, e-sign, sign PDF, free signature, draw signature, typed signature, open source esign, self-host signature, offline sign PDF" />
    <meta name="author" content="UNI·SIM" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://opensource.unisim.co.uk/signatures/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal Signatures" />
    <meta property="og:url" content="https://opensource.unisim.co.uk/signatures/" />
    <meta property="og:title" content="Universal Signatures — sign PDFs in your browser, free" />
    <meta property="og:description" content="Draw or type your signature and sign PDFs entirely in your browser. Free, open source, documents never leave your device." />
    <meta property="og:image" content="https://opensource.unisim.co.uk/signatures/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal Signatures — sign PDFs in your browser, free" />
    <meta name="twitter:description" content="Draw or type your signature and sign PDFs entirely in your browser. Free, open source." />
    <meta name="twitter:image" content="https://opensource.unisim.co.uk/signatures/og-image.png" />

    <!-- Cursive faces for typed signatures are self-hosted (bundled) via
         @font-face in src/index.css, so they work offline / on local preview. -->
    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Signatures",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/signatures/",
      "description": "Universal Signatures — draw or type your signature and sign PDFs entirely in your browser. 100% free and open source; documents never leave your device. Save a verified signature to the cloud with a Universal ID, or self-host for free.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
