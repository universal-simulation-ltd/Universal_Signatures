<svg xmlns="http://www.w3.org/2000/svg" width="280" height="44" viewBox="0 0 280 44" role="img" aria-label="Signed with Universal Signatures — click to verify">
  <!-- The "image + link" badge, for places that won't run a script (email,
       Markdown, some site builders). It is a fixed picture: the CHECK happens
       on the certificate page it links to, so it says "click to verify" and
       never claims "verified" by itself — the script badge (badge.js) is the
       one that looks the certificate up and can say so.
       <switch> + systemLanguage shows the viewer's language where the browser
       supports it, English otherwise. -->
  <rect x="0.5" y="0.5" width="279" height="43" rx="21.5" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="22" cy="22" r="11" fill="#ea580c"/>
  <path d="M16.5 22.5l3.6 3.4 7.4-7.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#0f172a">
    <switch>
      <text x="42" y="20" font-size="13" font-weight="600" systemLanguage="fr">Signé · cliquez pour vérifier</text>
      <text x="42" y="20" font-size="13" font-weight="600" systemLanguage="es">Firmado · haz clic para verificar</text>
      <text x="42" y="20" font-size="13" font-weight="600" systemLanguage="it">Firmato · clicca per verificare</text>
      <text x="42" y="20" font-size="13" font-weight="600" systemLanguage="de">Unterschrieben · zum Prüfen klicken</text>
      <text x="42" y="20" font-size="13" font-weight="600" systemLanguage="pt">Assinado · clique para verificar</text>
      <text x="42" y="20" font-size="13" font-weight="600" systemLanguage="tr">İmzalı · doğrulamak için tıklayın</text>
      <text x="42" y="20" font-size="13" font-weight="600">Signed · click to verify</text>
    </switch>
    <text x="42" y="34" font-size="10.5" fill="#64748b">Universal Signatures</text>
  </g>
</svg>
